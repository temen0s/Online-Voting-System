<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Online Voting System</title>
    <script>
        // Check Admin Session Token
        if (!localStorage.getItem('adminToken')) {
            window.location.href = '/admin-login.html';
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f8f9fa; }
        .container { max-width: 750px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 2px 8px rgba(0,0,0,0.1); margin: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .logout-btn { background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .section { margin-top: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 6px; background-color: #fafafa; }
        input, button { padding: 8px 12px; margin-top: 6px; border-radius: 4px; border: 1px solid #ccc; }
        button { cursor: pointer; }
        .btn-green { background-color: #28a745; color: white; border: none; font-weight: bold; }
        .btn-red { background-color: #dc3545; color: white; border: none; font-weight: bold; }
        .btn-white { background-color: white; color: #333; border: 1px solid #ccc; font-weight: bold; }
        .category-box { background: white; padding: 10px; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
        /* Modal Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; padding: 25px; border-radius: 8px; width: 320px; text-align: center; box-shadow: 0px 4px 12px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Admin Election Control Panel</h2>
        <button onclick="adminLogout()" class="logout-btn">Logout</button>
    </div>

    <div class="section">
        <h3>1. Setup Election</h3>
        <label for="electionTitle"><strong>Election Title:</strong></label><br>
        <input type="text" id="electionTitle" placeholder="e.g. Student Council Elections 2026" style="width: 90%;"><br><br>

        <div id="categoriesContainer"></div>
        <button onclick="addCategoryField()" style="background: #007bff; color: white; border: none; margin-top: 10px;">+ Add Category</button>
        <br><br>
        <button onclick="saveDraft()" class="btn-green">1. Save Election Draft</button>
    </div>

    <div class="section">
        <h3>2. Active Election Controls</h3>
        <p>Current Draft ID: <strong id="currentDraftIdDisplay">None (Save a draft first)</strong></p>
        
        <label for="durationInput"><strong>Set Time Limit (Minutes):</strong></label><br>
        <input type="number" id="durationInput" placeholder="e.g., 60 (Leave blank for unlimited)" min="1" style="width: 60%;"><br><br>

        <button onclick="startElection()" class="btn-green" style="padding: 10px 18px;">PUSH "GO" (Start Election)</button>
        <button onclick="openEndModal()" class="btn-red" style="padding: 10px 18px; margin-left: 10px;">End Election</button>
    </div>
</div>

<div id="confirmEndModal" class="modal-overlay">
    <div class="modal-card">
        <h3 style="margin-top: 0; color: #d9534f;">Are you sure?</h3>
        <p style="color: #555; font-size: 14px;">Ending the election will immediately close voting access for all users.</p>
        <div style="display: flex; justify-content: space-around; margin-top: 20px;">
            <button onclick="confirmEndElection()" class="btn-red" style="padding: 8px 20px; background-color: red;">Sure</button>
            <button onclick="closeEndModal()" class="btn-white" style="padding: 8px 20px; background-color: white;">Close</button>
        </div>
    </div>
</div>

<script>
    let currentElectionId = null;

    function adminLogout() {
        localStorage.removeItem('adminToken');
        window.location.href = '/admin-login.html';
    }

    function addCategoryField() {
        const container = document.getElementById('categoriesContainer');
        const catDiv = document.createElement('div');
        catDiv.className = 'category-box';
        catDiv.innerHTML = `
            <label>Category Name:</label>
            <input type="text" class="cat-name" placeholder="e.g. President" style="width: 80%;"><br><br>
            <label>Candidates (Comma Separated Name:Party):</label><br>
            <input type="text" class="cat-cands" placeholder="Alice:Party A, Bob:Party B" style="width: 90%;">
        `;
        container.appendChild(catDiv);
    }

    async function saveDraft() {
        const title = document.getElementById('electionTitle').value;
        const catBoxes = document.querySelectorAll('.category-box');

        if (!title) { alert('Please enter an election title.'); return; }

        const categories = [];
        catBoxes.forEach(box => {
            const name = box.querySelector('.cat-name').value;
            const candsRaw = box.querySelector('.cat-cands').value;
            if (name && candsRaw) {
                const candidates = candsRaw.split(',').map(c => {
                    const parts = c.trim().split(':');
                    return { name: parts[0], party: parts[1] || '' };
                });
                categories.push({ name, candidates });
            }
        });

        const res = await fetch('/api/admin/setup-election', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, categories })
        });

        const data = await res.json();
        if (res.ok) {
            currentElectionId = data.electionId;
            document.getElementById('currentDraftIdDisplay').innerText = `#${currentElectionId}`;
            alert(data.message);
        } else {
            alert(data.error || 'Failed to save draft.');
        }
    }

    async function startElection() {
        if (!currentElectionId) {
            alert('Please save an election draft first before pushing GO.');
            return;
        }

        const durationMinutes = document.getElementById('durationInput').value;

        const res = await fetch('/api/admin/start-election', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ electionId: currentElectionId, durationMinutes })
        });

        const data = await res.json();
        if (res.ok) {
            alert(data.message);
        } else {
            alert(data.error || 'Failed to start election.');
        }
    }

    function openEndModal() {
        document.getElementById('confirmEndModal').style.display = 'flex';
    }

    function closeEndModal() {
        document.getElementById('confirmEndModal').style.display = 'none';
    }

    async function confirmEndElection() {
        closeEndModal();
        const res = await fetch('/api/admin/end-election', { method: 'POST' });
        const data = await res.json();

        if (res.ok) {
            alert(data.message);
        } else {
            alert(data.error || 'Failed to end election.');
        }
    }

    // Initialize with one category field
    addCategoryField();
</script>

</body>
</html>
