<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Online Voting System</title>
    <script>
        // Check Voter Session Token (same pattern admin.html uses)
        if (!localStorage.getItem('voterToken')) {
            window.location.href = '/';
        }
    </script>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Page-specific only ~ everything else lives in styles.css */
        .container { --container-width: 500px; }
    </style>
</head>
<body>

<div class="container">
    <div id="studentNav"></div>

    <div class="section">
        <h3>Change Password</h3>
        <p class="helper-text">You'll need your current password to set a new one. This does not affect any votes you've already cast.</p>

        <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password">
        </div>
        <button onclick="submitChangePassword()" class="btn btn-primary">Update Password</button>
        <div id="passwordMsg" class="msg"></div>
    </div>
</div>

<script src="/inactivity-guard.js"></script>
<script src="/student-common.js"></script>
<script>
    const voterToken = requireVoterAuth();
    renderStudentNav('password');

    function showMsg(text, isError) {
        const el = document.getElementById('passwordMsg');
        el.textContent = text;
        el.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
        el.style.display = 'block';
    }

    async function submitChangePassword() {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
            showMsg('Please fill in all fields.', true);
            return;
        }
        if (newPassword.length < 6) {
            showMsg('New password must be at least 6 characters.', true);
            return;
        }
        if (newPassword !== confirmPassword) {
            showMsg('New password and confirmation do not match.', true);
            return;
        }

        const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: studentAuthHeaders(),
            body: JSON.stringify({ currentPassword, newPassword })
        });
        if (handleAuthFailure(res)) return;

        const data = await res.json();
        if (res.ok) {
            showMsg(data.message, false);
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } else {
            showMsg(data.error || 'Failed to change password.', true);
        }
    }

    startInactivityGuard({
        onTimeout: () => {
            alert('You have been signed out due to inactivity.');
            logoutStudent();
        }
    });
</script>

</body>
</html>
