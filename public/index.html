<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Online Voting System</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Page-specific only ~ everything else lives in styles.css */
        .container { --container-width: 800px; }
        .btn { margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="/admin-login.html" class="admin-pill">🛡️ Admin Login →</a>

    <div id="authSection">
        <h2>Student Portal</h2>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Login</div>
            <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">Register</div>
        </div>

        <!-- LOGIN -->
        <div id="loginPane">
            <div class="form-group">
                <label>University ID or Email</label>
                <input type="text" id="loginUniId" placeholder="e.g. STU1001 or you@university.edu">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Your password">
            </div>
            <button onclick="login()" class="btn btn-primary">Login to Dashboard</button>
        </div>

        <!-- REGISTER (step 1) -->
        <div id="registerPane" style="display:none;">
            <div class="form-group">
                <label>University ID</label>
                <input type="text" id="regUniId" placeholder="e.g. STU1001">
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regFullName" placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="you@university.edu">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="At least 6 characters">
            </div>
            <button onclick="register()" class="btn btn-primary">Send OTP to Email</button>
        </div>

        <!-- REGISTER (step 2: OTP) -->
        <div id="otpPane" style="display:none;">
            <p>We emailed a 6-digit code to <strong id="otpEmailDisplay"></strong>. Enter it below to activate your account.</p>
            <div class="form-group">
                <label>OTP Code</label>
                <input type="text" id="otpCode" placeholder="123456" maxlength="6">
            </div>
            <button onclick="verifyOtp()" class="btn btn-success">Verify & Activate Account</button>
            <button onclick="resendOtp()" class="btn btn-link" style="margin-left:10px;">Resend code</button>
        </div>

        <div id="authMsg" class="msg"></div>
    </div>

    <div id="dashboardSection" style="display: none;">
        <div id="studentNav"></div>

        <h3>Elections Overview</h3>
        <div id="electionsList"></div>

        <div id="electionDetailView" class="card" style="display: none;"></div>
    </div>
</div>

<script src="/inactivity-guard.js"></script>
<script>
    let voterToken = localStorage.getItem('voterToken');
    let pendingUniId = null; // set after register(), used by verifyOtp()/resendOtp()

    if (voterToken) {
        verifySavedSession();
    }

    // Confirms a token saved from a previous visit is still good before
    // trusting it enough to show the dashboard. A token issued before the
    // last server restart fails this check even though it's still a
    // correctly-signed JWT ~ see the bootId check in middleware/auth.js.
    async function verifySavedSession() {
        try {
            const res = await fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${voterToken}` }
            });
            if (res.ok) {
                showDashboard();
            } else {
                clearAllSessions();
            }
        } catch (err) {
            clearAllSessions();
        }
    }

    // Wipes both the voter and admin tokens, so a session ending in one
    // portal (e.g. because the server was restarted) can't leave a stale
    // session usable in the other.
    function clearAllSessions() {
        localStorage.removeItem('voterToken');
        localStorage.removeItem('adminToken');
        voterToken = null;
    }

    function handleAuthFailure(res) {
        if (res.status === 401 || res.status === 403) {
            clearAllSessions();
            alert('Your session has ended (the server may have restarted). Please log in again.');
            location.reload();
            return true;
        }
        return false;
    }

    function switchTab(tab) {
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        document.getElementById('loginPane').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerPane').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('otpPane').style.display = 'none';
        hideMsg();
    }

    // Election titles, category names, candidate names and party labels are
    // all admin-entered free text that gets rendered into innerHTML below.
    // Without escaping, an admin could store markup (e.g. a candidate named
    // "<img src=x onerror=...>") that would then execute in every student's
    // browser ~ a stored XSS. Everything admin-controlled goes through here
    // before it reaches the DOM.
    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[char]));
    }

    function showMsg(text, isError) {
        const el = document.getElementById('authMsg');
        el.textContent = text;
        el.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
        el.style.display = 'block';
    }
    function hideMsg() {
        document.getElementById('authMsg').style.display = 'none';
    }

    async function login() {
        const identifier = document.getElementById('loginUniId').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!identifier || !password) {
            showMsg('Please enter your university ID or email, and password.', true);
            return;
        }

        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        if (res.ok) {
            voterToken = data.token;
            localStorage.setItem('voterToken', voterToken);
            showDashboard();
        } else {
            showMsg(data.error || 'Login failed.', true);
        }
    }

    async function register() {
        const universityId = document.getElementById('regUniId').value.trim();
        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!universityId || !fullName || !email || !password) {
            showMsg('Please fill in all fields.', true);
            return;
        }

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ universityId, fullName, email, password })
        });

        const data = await res.json();
        if (res.ok) {
            pendingUniId = universityId;
            document.getElementById('otpEmailDisplay').textContent = email;
            document.getElementById('registerPane').style.display = 'none';
            document.getElementById('otpPane').style.display = 'block';
            showMsg(data.message, false);
        } else {
            showMsg(data.error || 'Registration failed.', true);
        }
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpCode').value.trim();
        if (!pendingUniId || !otp) {
            showMsg('Please enter the OTP code.', true);
            return;
        }

        const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ universityId: pendingUniId, otp })
        });

        const data = await res.json();
        if (res.ok) {
            showMsg(data.message + ' You can log in now.', false);
            document.getElementById('otpPane').style.display = 'none';
            switchTab('login');
            document.getElementById('loginUniId').value = pendingUniId;
        } else {
            showMsg(data.error || 'Verification failed.', true);
        }
    }

    async function resendOtp() {
        if (!pendingUniId) return;
        const res = await fetch('/api/auth/resend-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ universityId: pendingUniId })
        });
        const data = await res.json();
        showMsg(res.ok ? data.message : (data.error || 'Could not resend OTP.'), !res.ok);
    }

    function logout() {
        clearAllSessions();
        location.reload();
    }

    function showDashboard() {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        renderDashboardNav();
        loadElectionsList();
        startInactivityGuard({
            onTimeout: () => {
                alert('You have been signed out due to inactivity.');
                logout();
            }
        });
    }

    // Same nav markup/behavior as the shared one in student-common.js
    // (used by profile.html, voting-history.html, change-password.html),
    // kept as a local copy here so this page doesn't have to load an
    // extra script or risk its own escapeHtml/logout definitions
    // clashing with equivalently-named ones elsewhere.
    function renderDashboardNav() {
        const pages = [
            { key: 'dashboard', href: '/', label: 'Elections' },
            { key: 'profile', href: '/profile.html', label: 'Profile' },
            { key: 'history', href: '/voting-history.html', label: 'Voting History' },
            { key: 'password', href: '/change-password.html', label: 'Change Password' },
        ];
        const nav = document.getElementById('studentNav');
        if (!nav) return;
        nav.innerHTML = `
            <div class="header-bar">
                <div class="student-nav-links">
                    ${pages.map(p => `<a href="${p.href}" class="student-nav-link${p.key === 'dashboard' ? ' active' : ''}">${p.label}</a>`).join('')}
                </div>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
        `;
    }

    // Reads the (unverified, client-side-only) universityId claim out
    // of the voter JWT, just to scope localStorage keys per-student on
    // a shared device. Never used for anything security-relevant ~
    // every real check happens server-side against the signed token.
    function getVoterUniversityId() {
        if (!voterToken) return null;
        try {
            const payload = JSON.parse(atob(voterToken.split('.')[1]));
            return payload.universityId || null;
        } catch (e) {
            return null;
        }
    }

    // Saves the receipt hashes handed back by POST /api/vote so the
    // Voting History page can show them later. This is deliberately a
    // browser-only record: ballot_box carries no link back to
    // university_id (see Voting_system.sql), so the server itself has
    // no way to answer "what were my receipts?" after the fact without
    // undermining that anonymity. Saved once, here, at the only moment
    // the server ever reveals them to this voter.
    function saveReceiptsLocally(electionId, hashes) {
        const uid = getVoterUniversityId();
        if (!uid || !hashes || hashes.length === 0) return;
        const key = `voteReceipts:${uid}`;
        let store = {};
        try { store = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { store = {}; }
        store[electionId] = { hashes, savedAt: new Date().toISOString() };
        localStorage.setItem(key, JSON.stringify(store));
    }

    async function loadElectionsList() {
        const res = await fetch('/api/elections/overview');
        const data = await res.json();
        const container = document.getElementById('electionsList');
        container.innerHTML = '';

        if (!data.elections || data.elections.length === 0) {
            container.innerHTML = '<p>No elections found.</p>';
            return;
        }

        data.elections.forEach(elec => {
            const isLive = elec.status === 'active';
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${escapeHtml(elec.title)}</strong>
                        <span class="badge ${isLive ? 'badge-active' : 'badge-closed'}">${escapeHtml(elec.status.toUpperCase())}</span>
                    </div>
                    <button onclick="viewElection(${Number(elec.election_id)}, '${escapeHtml(elec.status)}')" class="btn btn-primary">
                        ${isLive ? 'Open Election' : 'View Final Results'}
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function viewElection(electionId, status) {
        const detailView = document.getElementById('electionDetailView');
        detailView.style.display = 'block';

        if (status === 'closed') {
            renderResultsView(electionId, true);
            return;
        }

        const statusRes = await fetch(`/api/voter/status?electionId=${electionId}`, {
            headers: { 'Authorization': `Bearer ${voterToken}` }
        });
        if (handleAuthFailure(statusRes)) return;
        const statusData = await statusRes.json();

        if (statusData.hasVoted) {
            renderResultsView(electionId, false, "You have already cast your vote for this election. Here are the live results:");
        } else {
            renderBallotView(electionId);
        }
    }

    async function renderBallotView(electionId) {
        const res = await fetch(`/api/election/${electionId}/ballot`);
        if (!res.ok) {
            document.getElementById('electionDetailView').innerHTML = '<p>This election is not currently open for voting.</p>';
            return;
        }
        const data = await res.json();
        const detailView = document.getElementById('electionDetailView');

        let html = `<h3>Cast Your Vote: ${escapeHtml(data.title)}</h3><form id="ballotForm">`;

        data.categories.forEach(cat => {
            html += `<div style="margin-bottom: 15px;"><h4>${escapeHtml(cat.category_name)}</h4>`;
            cat.candidates.forEach(cand => {
                html += `
                    <div class="candidate-option">
                        <label>
                            <input type="radio" name="cat_${Number(cat.category_id)}" value="${Number(cand.candidate_id)}" required>
                            <strong>${escapeHtml(cand.candidate_name)}</strong> (${escapeHtml(cand.party || 'Independent')})
                        </label>
                    </div>
                `;
            });
            html += `</div>`;
        });

        html += `<button type="button" onclick="submitVote(${Number(data.electionId)})" class="btn btn-success">Submit Ballot</button></form>`;
        detailView.innerHTML = html;
    }

    async function submitVote(electionId) {
        const form = document.getElementById('ballotForm');
        const formData = new FormData(form);
        const votes = [];

        for (let [key, value] of formData.entries()) {
            const categoryId = key.replace('cat_', '');
            votes.push({ categoryId: parseInt(categoryId), candidateId: parseInt(value) });
        }

        const res = await fetch('/api/vote', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${voterToken}`
            },
            body: JSON.stringify({ electionId, votes })
        });
        if (handleAuthFailure(res)) return;

        const data = await res.json();
        if (res.ok) {
            saveReceiptsLocally(electionId, data.receipts);
            alert('Vote submitted successfully! You can find your receipt under Voting History.');
            viewElection(electionId, 'active');
        } else {
            alert(data.error || 'Failed to submit vote.');
        }
    }

    async function renderResultsView(electionId, isClosed, bannerText = "") {
        const res = await fetch(`/api/election/${electionId}/results`);
        const data = await res.json();
        const detailView = document.getElementById('electionDetailView');

        let html = `<h3>${isClosed ? 'Final Election Results' : 'Live Standings'}</h3>`;
        if (bannerText) html += `<p class="banner-note">${escapeHtml(bannerText)}</p>`;

        data.categories.forEach(cat => {
            html += `<h4>${escapeHtml(cat.category_name)}</h4>`;
            const maxVotes = Math.max(...cat.candidates.map(c => Number(c.vote_count)), 0);

            cat.candidates.forEach(cand => {
                const isWinning = Number(cand.vote_count) === maxVotes && maxVotes > 0;
                html += `
                    <div class="candidate-option">
                        <span>
                            <strong>${escapeHtml(cand.candidate_name)}</strong> (${escapeHtml(cand.party || 'Independent')})
                            ${isWinning ? `<span class="winner-tag">\u{1F3C6} ${isClosed ? 'WINNER' : 'LEADING'}</span>` : ''}
                        </span>
                        <span><strong>${Number(cand.vote_count)}</strong> votes</span>
                    </div>
                `;
            });
        });

        detailView.innerHTML = html;
    }
</script>

</body>
</html>
